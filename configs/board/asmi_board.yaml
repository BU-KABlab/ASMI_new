# ASMI board configuration — real hardware.
# `measurement_height` here is the default action Z when the protocol
# doesn't override it per-call. For ASMI's deck-frame +Z-up convention,
# the protocol typically passes `measurement_height` per-step (the well
# rim z), so 0.0 is just a safe fallback.

instruments:
  asmi:
    type: asmi
    vendor: vernier
    offset_x: 0.0
    offset_y: 0.0
    depth: 0.0
    measurement_height: 0.0
    safe_approach_height: 3.0
    # Sensor hardware
    force_threshold: -50
    sensor_channels: [1]
