# ASMI board configuration — mock hardware for dry runs.

instruments:
  asmi:
    type: mock_asmi
    offset_x: 0.0
    offset_y: 0.0
    depth: 0.0
    measurement_height: 0.0
    default_force: 0.5
    # Indentation parameters (same as real, but mock completes instantly)
    z_target: -90.0
    step_size: 0.01
    force_limit: 10.0
    well_top_z: -73.0
    safe_z: -50.0
    baseline_samples: 10
