# ASMI single-well indentation test.
#
# CubOS deck-origin +Z-up. Heights on `measure`/`scan` are
# *labware-relative* offsets above the plate surface (`labware.height_mm`):
#   action_z = labware.height_mm + measurement_height
# Inter-labware travel uses the gantry's `safe_z` (absolute).
#
# Uses cubos `measure` (single-position dispatch) rather than `scan` so
# we don't iterate the plate. Pick the well via `position: plate.<well>`.
#
# Field sourcing: `measurement_height` is set on the gantry yaml's asmi
# instrument config (= 0.0, well-rim). It could also be set here; if both
# are set they must match (the validator rejects conflicts).
# `indentation_limit` is a sign-agnostic *magnitude* — the descent
# distance below the action plane.
#
# Protocol flow: home → measure one well → park → home

positions:
  park_position: [0.0, 0.0, 80.0]

protocol:
  - home:

  - measure:
      instrument: asmi
      position: plate.E5            # arbitrary well; change if testing elsewhere
      method: indentation
      method_kwargs:
        # 5 mm of descent below the well rim; force_limit usually fires first.
        indentation_limit: 5.0
        step_size: 0.01
        force_limit: 10.0
        baseline_samples: 10
        measure_with_return: false

  - move:
      instrument: asmi
      position: park_position
      travel_z: 80.0

  - home:
