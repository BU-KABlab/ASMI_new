# ASMI single-well indentation test.
# Deck-origin +Z-up: z=0 at deck bottom, z=92 at home.
# Indentation descends (Z decreases) from measurement_height toward
# indentation_limit, stopping at force_limit or indentation_limit.
#
# Uses cubos `measure` (single-position dispatch) rather than `scan` so
# we don't iterate the plate. Pick the well via `position: plate.<well>`.
#
# Requires cubos branch with `measure` accepting `measurement_height` and
# injecting gantry into closed-loop methods (PR #114 / branch
# feature/measure-gantry-injection).
#
# Protocol flow: home → measure one well → park → home

positions:
  safe_z: [0.0, 0.0, 80.0]

protocol:
  - home:

  - measure:
      instrument: asmi
      position: plate.E5            # arbitrary well; change if testing elsewhere
      method: indentation
      measurement_height: 25.9      # absolute well-rim Z (matches deck cal a1.z)
      method_kwargs:
        indentation_limit: 20.9     # ~5 mm dive headroom; force_limit usually fires first
        step_size: 0.01
        force_limit: 10.0
        baseline_samples: 10
        measure_with_return: false

  - move:
      instrument: asmi
      position: safe_z
      travel_z: 80.0

  - home:
