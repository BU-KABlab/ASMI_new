# ASMI indentation protocol.
# Scans the well plate, performing step-by-step indentation at each well.
# Uses panda-core protocol engine (feature/uv-curing-instrument) for
# method_kwargs passthrough and named-position moves.

positions:
  safe_z: [0.0, 0.0, -50.0]
  pickup: [0.0, 0.0, -50.0]

protocol:
  - move:
      instrument: asmi
      position: safe_z

  - scan:
      plate: plate
      instrument: asmi
      method: indentation
      method_kwargs:
        z_target: -83.0
        step_size: 0.01
        force_limit: 10.0
        well_top_z: -73.0
        baseline_samples: 10
        safe_z: -50.0

  - move:
      instrument: asmi
      position: pickup
