# ASMI gantry configuration.
# Genmitsu 3018 PRO with ASMI indenter mounted.
# Positive-down Z: 0 at home (top of travel), grows toward the deck.

serial_port: /dev/ttyUSB0

cnc:
  homing_strategy: standard
  total_z_height: 100.0
  y_axis_motion: head

working_volume:
  x_min: 0.0
  x_max: 400.0
  y_min: 0.0
  y_max: 300.0
  z_min: 0.0
  z_max: 100.0

grbl_settings:
  homing_enable: true
  steps_per_mm_x: 400.0
  steps_per_mm_y: 400.0
  steps_per_mm_z: 400.0
  max_travel_x: 400.0
  max_travel_y: 300.0
  max_travel_z: 100.0

instruments:
  asmi:
    type: asmi
    vendor: vernier
    offset_x: 0.0
    offset_y: 0.0
    depth: 0.0
    measurement_height: 0.0
    safe_approach_height: 3.0
    force_threshold: -50
    sensor_channels:
      - 1
