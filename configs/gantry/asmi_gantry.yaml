# ASMI gantry configuration.
# Genmitsu 3018 PRO with ASMI indenter mounted.
# After homing + G92 zero, all coordinates are negative from home.

serial_port: /dev/ttyUSB0
cnc:
  homing_strategy: standard

working_volume:
  x_min: -400.0
  x_max: 0.01   # 0.01 avoids "not set" warning; home WPos ≈ (0, 0)
  y_min: -300.0
  y_max: 0.01
  z_min: -80.0
  z_max: 0.0

safe_z: -50.0
idle_timeout: 10.0
unlock_delay: 1.0
homing_feed: 2000
homing_seek: 2000
max_rate: 2000
acceleration: 500

grbl_settings:
  homing_enable: true
  steps_per_mm_x: 400.0
  steps_per_mm_y: 400.0
  steps_per_mm_z: 400.0
  max_travel_x: 400.0
  max_travel_y: 300.0
  max_travel_z: 80.0
