serial_port: /dev/ttyUSB0
cnc:
  homing_strategy: standard
  total_z_height: 92.0
  y_axis_motion: head
  # Absolute deck-frame Z used for inter-labware travel and the entry
  # approach to the first well of a scan. Defaults to working_volume.z_max
  # (= 92) when omitted; setting an explicit lower value matches the
  # previous park height the protocols used.
  safe_z: 80.0
working_volume:
  x_min: 0.0
  x_max: 400.0
  y_min: 0.0
  y_max: 284.0
  z_min: 0.0
  z_max: 92.0
grbl_settings:
  homing_enable: true
  steps_per_mm_x: 400.0
  steps_per_mm_y: 400.0
  steps_per_mm_z: 400.0
  max_travel_x: 400.0
  max_travel_y: 284.0
  max_travel_z: 92.0
  status_report: 0
  soft_limits: true
instruments:
  asmi:
    type: asmi
    vendor: vernier
    offset_x: 0.0
    offset_y: 0.0
    depth: 0.0
    # Labware-relative offsets (mm above labware.height_mm; negative = below).
    # The protocol may also set these; if both are set they must match.
    # 0.0 = exactly at the well-rim (matches the previous absolute setup
    # where measurement_height tracked deck cal a1.z).
    measurement_height: 0.0
    # 3 mm above the well rim for between-wells travel during scans.
    safe_approach_height: 3.0
    force_threshold: -50
    sensor_channels:
    - 1
